<header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-40 border-b border-gray-200/80">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3 cursor-pointer" [routerLink]="['/']">
      <svg class="h-9 w-9 text-orange-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.82m5.84-2.56a16.5 16.5 0 01-2.08 2.08M15.59 14.37A16.5 16.5 0 0118 12m-2.41 2.37a6 6 0 01-7.38-5.84m2.56 5.84a16.5 16.5 0 01-2.08-2.08M12 18a6 6 0 01-6-6h4.82m2.56 0a16.5 16.5 0 012.08-2.08M12 6a6 6 0 016 6h-4.82m-2.56 0a16.5 16.5 0 01-2.08 2.08M6 12a6 6 0 016-6v4.82m-5.84 2.56a16.5 16.5 0 012.08-2.08" />
      </svg>
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">GoFood</h1>
    </div>
    @if (!currentUser()) {
      <nav class="hidden md:flex items-center space-x-10">
        <a [routerLink]="['/']" class="text-gray-600 font-semibold hover:text-orange-500 transition-colors duration-300 cursor-pointer relative group">
          <span>Inicio</span>
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-orange-500 transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a [routerLink]="['/reservations']" class="text-gray-600 font-semibold hover:text-orange-500 transition-colors duration-300 cursor-pointer relative group">
          <span>Reservas</span>
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-orange-500 transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a [routerLink]="['/nosotros']" class="text-gray-600 font-semibold hover:text-orange-500 transition-colors duration-300 cursor-pointer relative group">
          <span>Nosotros</span>
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-orange-500 transition-all duration-300 group-hover:w-full"></span>
        </a>
      </nav>
    }
    <div class="flex items-center space-x-5">
      @if (!currentUser()) {
        <button (click)="toggleCart.emit()" class="relative text-gray-700 hover:text-orange-500 transition-colors duration-300">
          <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.658-.463 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
          @if (cartItemCount() > 0) {
            <span class="absolute -top-2 -right-3 bg-orange-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">{{ cartItemCount() }}</span>
          }
        </button>
      }
      
      @if (currentUser(); as user) {
        <div class="hidden md:flex items-center space-x-4">
          <div class="text-right">
            <div class="font-semibold text-gray-800">{{ user.name }}</div>
            <div class="text-xs text-gray-500 capitalize">{{ user.role }}</div>
          </div>
          <button (click)="onLogoutClicked()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded-full hover:bg-gray-300 transition-all duration-300 text-sm font-semibold">
            Salir
          </button>
        </div>
      } @else {
         <button (click)="showLogin.emit()" class="hidden md:block bg-orange-500 text-white px-5 py-2.5 rounded-full hover:bg-orange-600 transition-all duration-300 text-sm font-semibold shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
          Iniciar Sesión
        </button>
      }

      <button (click)="toggleMobileMenu()" class="md:hidden text-gray-700 hover:text-orange-500 transition-colors duration-300 z-50">
        @if (!isMobileMenuOpen()) {
          <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        } @else {
          <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        }
      </button>
    </div>
  </div>
</header>

<!-- Mobile Menu -->
@if (isMobileMenuOpen()) {
  <div class="fixed inset-0 bg-white z-30 md:hidden animate-slide-in-right">
    <div class="pt-24 h-full">
      <nav class="flex flex-col items-center justify-center h-full -mt-20">
        @if (currentUser(); as user) {
          <div class="text-center mb-12">
            <h3 class="text-2xl font-bold text-gray-800">{{ user.name }}</h3>
            <p class="text-lg text-gray-500 capitalize">{{ user.role }}</p>
          </div>
           <div class="mt-8 border-t border-gray-200 w-1/2"></div>
          <button (click)="onLogoutClicked()" class="mt-12 bg-gray-800 text-white px-8 py-3 rounded-full text-lg font-semibold hover:bg-gray-900 transition-all duration-300">
            Cerrar Sesión
          </button>
        } @else {
          <a [routerLink]="['/']" (click)="closeMenu()" class="text-3xl font-bold text-gray-800 hover:text-orange-500 py-4 transition-colors duration-300">Inicio</a>
          <a [routerLink]="['/reservations']" (click)="closeMenu()" class="text-3xl font-bold text-gray-800 hover:text-orange-500 py-4 transition-colors duration-300">Reservas</a>
          <a [routerLink]="['/nosotros']" (click)="closeMenu()" class="text-3xl font-bold text-gray-800 hover:text-orange-500 py-4 transition-colors duration-300">Nosotros</a>
          <div class="mt-8 border-t border-gray-200 w-1/2"></div>
          <button (click)="onLoginClicked()" class="mt-12 bg-orange-500 text-white px-8 py-3 rounded-full text-lg font-semibold hover:bg-orange-600 transition-all duration-300">
            Iniciar Sesión
          </button>
        }
      </nav>
    </div>
  </div>
}
