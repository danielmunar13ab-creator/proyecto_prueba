<div (click)="viewDetails()" class="bg-white rounded-xl shadow-md overflow-hidden transform hover:-translate-y-2 transition-transform duration-300 cursor-pointer flex flex-col group border border-gray-200/80 hover:shadow-xl">
  <div class="relative overflow-hidden">
    <img [src]="product().imageUrl" [alt]="product().name" class="w-full h-52 object-cover group-hover:scale-105 transition-transform duration-300">
    <span class="absolute top-3 right-3 bg-orange-500/90 text-white text-xs font-semibold px-3 py-1 rounded-full">{{ product().category | uppercase }}</span>
  </div>
  <div class="p-5 flex flex-col flex-grow">
    <h3 class="text-xl font-bold text-gray-900 mb-2 truncate">{{ product().name }}</h3>
    <p class="text-gray-600 text-sm mb-4 flex-grow">{{ product().description }}</p>
    <div class="flex justify-between items-center mt-auto pt-2">
      <span class="text-2xl font-bold text-gray-800">{{ product().price | currency:'COP':'symbol-narrow':'1.0-0' }}</span>
      <button (click)="addToCart($event, product())" class="bg-gray-800 text-white w-11 h-11 rounded-full flex items-center justify-center hover:bg-orange-500 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transform group-hover:scale-110">
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>
  </div>
</div>
